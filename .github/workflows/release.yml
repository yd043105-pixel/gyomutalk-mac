name: Publish signed desktop update
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  candidate:
    # Trial build + Developer ID signing + notarization; needs the mac-distribution environment.
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/mac-distribution.yml
    with:
      mode: notarize
    secrets: inherit
  publish:
    needs: candidate
    runs-on: macos-26
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gyomutalk-mac-distribution-candidate
          path: artifacts
      - name: Verify release and prepare signing dependencies
        shell: bash
        env:
          MAC_TEAM_ID: ${{ vars.MAC_TEAM_ID }}
        run: |
          python3 -m pip install --break-system-packages cryptography==50.0.2
          # Release Mac packages must already have Developer ID signatures and notarization.
          version="$(python3 -c 'import xml.etree.ElementTree as E;print(E.parse("Directory.Build.props").findtext("./PropertyGroup/Version"))')"
          [[ "$RELEASE_TAG" == "$version" || "$RELEASE_TAG" == "v$version" ]] || { echo "Release tag $RELEASE_TAG does not match version $version" >&2; exit 1; }
          for architecture in arm64 x64; do
            python3 scripts/mac-distribution.py verify "artifacts/gyomutalk-mac-$version-macos-$architecture.zip" "$architecture"
          done
      - name: Sign exact installers and upload feed last
        shell: bash
        env:
          UPDATER_ED25519_SEED: ${{ secrets.UPDATER_ED25519_SEED }}
        run: |
          version="$(python3 -c 'import xml.etree.ElementTree as E;print(E.parse("Directory.Build.props").findtext("./PropertyGroup/Version"))')"
          for architecture in arm64 x64; do
            asset="artifacts/gyomutalk-mac-$version-macos-$architecture.zip"
            python3 scripts/Create-UpdateFeed.py --asset "$asset" --tag "$RELEASE_TAG" --architecture "$architecture" --output "artifacts/appcast-$architecture.xml"
            gh release upload "$RELEASE_TAG" "$asset" "$asset.sha256" --repo "$GITHUB_REPOSITORY"
          done
          gh release upload "$RELEASE_TAG" artifacts/appcast-arm64.xml artifacts/appcast-x64.xml --repo "$GITHUB_REPOSITORY"

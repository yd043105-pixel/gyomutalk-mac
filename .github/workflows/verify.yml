name: Native Mac verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      publish_trial:
        description: Publish verified trial ZIPs as a prerelease without an update feed
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      YY_TEST_SERVICE_ROOT: ${{ github.workspace }}/.test-services
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout pinned server sources for synthetic tests only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yd043105-pixel/gyomutalk-server
          ref: 0c6bf3a572bfbb04142c8c2eda7583b24705e667
          path: .test-services
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install pinned Apple workload
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          dotnet workload install maui-maccatalyst --version 10.0.401
          dotnet restore src/SchoolMessenger.Mac --locked-mode
      - name: Build native app and isolated test services
        run: |
          runtime=maccatalyst-x64
          [[ "$(uname -m)" != arm64 ]] || runtime=maccatalyst-arm64
          dotnet build src/SchoolMessenger.Mac -c Debug -r "$runtime" --no-restore -p:MacVerification=true -p:CodesignKey=- -p:CodesignRequireProvisioningProfile=false
          dotnet build .test-services/src/SchoolMessenger.Server -p:RestoreLockedMode=true
          dotnet build .test-services/src/SchoolMessenger.AnnouncementServer -p:RestoreLockedMode=true
      - name: Embed signed updater into the native test application
        run: |
          runtime=maccatalyst-x64; arch=x86_64
          [[ "$(uname -m)" != arm64 ]] || { runtime=maccatalyst-arm64; arch=arm64; }
          bundle="$(find "src/SchoolMessenger.Mac/bin/Debug/net10.0-maccatalyst/$runtime" -maxdepth 1 -name '*.app' -print -quit)"
          bash scripts/Embed-MacUpdater.sh "$bundle" "$arch"
      - name: Verify actual native application
        run: node tests/mac-runtime.mjs
      - name: Publish both Mac architectures
        run: |
          bash scripts/Build-Mac.sh maccatalyst-arm64
          bash scripts/Build-Mac.sh maccatalyst-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gyomutalk-mac-trial
          path: artifacts/mac/
          retention-days: 7
          if-no-files-found: error
  publish-trial:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_trial }}
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gyomutalk-mac-trial
          path: artifacts/trial
      - name: Publish native-verified trial packages
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import xml.etree.ElementTree as E;print(E.parse("Directory.Build.props").findtext("./PropertyGroup/Version"))')"
          tag="v$version"
          for arch in arm64 x64; do
            asset="artifacts/trial/gyomutalk-mac-$version-macos-$arch.zip"
            expected="$(cut -d' ' -f1 "$asset.sha256")"
            actual="$(sha256sum "$asset" | cut -d' ' -f1)"
            [[ "$expected" =~ ^[0-9a-f]{64}$ && "$actual" == "$expected" ]]
          done
          if gh release view "$tag" --json isDraft --jq .isDraft > /dev/null 2>&1; then
            echo 'A release already exists; do not replace its assets.' >&2; exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "교무톡 Mac $version 시험용" --notes-file "docs/releases/$version.md"
          gh release upload "$tag" "artifacts/trial/gyomutalk-mac-$version-macos-arm64.zip" "artifacts/trial/gyomutalk-mac-$version-macos-arm64.zip.sha256" "artifacts/trial/gyomutalk-mac-$version-macos-x64.zip" "artifacts/trial/gyomutalk-mac-$version-macos-x64.zip.sha256" artifacts/trial/mac-results.json
          gh release edit "$tag" --draft=false --prerelease --latest=false
